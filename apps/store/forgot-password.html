<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Forgot Password - ABDULLAH STORE</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
  </head>
  <body style="justify-content: center; align-items: center; padding: 24px 16px;">
    <div class="glass-card" style="width: 100%; max-width: 420px; padding: 32px 28px;">
      <div style="text-align: center; margin-bottom: 24px;">
        <h1 style="font-size: 1.4rem; font-weight: 800; color: #FFFFFF;">Reset Password</h1>
        <p style="font-size: 0.85rem; color: #94A3B8; margin-top: 4px;">Enter your email to receive a password reset link</p>
      </div>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label" for="reset-email">Your Account Email</label>
          <input type="email" id="reset-email" class="form-input" required placeholder="you@example.com" />
        </div>

        <button type="submit" id="submit-reset-btn" class="btn btn-primary btn-block">
          Send Reset Link
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px;">
        <a href="/login.html" style="font-size: 0.85rem; color: var(--neon-cyan);">&larr; Back to Login</a>
      </div>
    </div>

    <script type="module" src="/js/app.js"></script>
    <script type="module">
      import { resetPassword } from "/js/auth.js";
      document.getElementById("reset-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("reset-email").value.trim();
        await resetPassword(email);
      });
    </script>
  </body>
</html>
