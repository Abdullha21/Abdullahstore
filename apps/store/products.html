<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>All Products - ABDULLAH STORE</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/home.css" />
    <link rel="stylesheet" href="/css/product.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div style="display: flex; align-items: center; gap: 12px;">
          <button class="icon-btn" id="mobile-menu-toggle">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <a href="/" class="brand-wrapper">
            <div class="brand-logo-icon">AS</div>
            <div class="brand-text">
              <span class="brand-title">ABDULLAH STORE</span>
              <span class="brand-subtitle">Catalog</span>
            </div>
          </a>
        </div>
        <div class="header-actions">
          <select class="currency-selector form-select" style="padding: 6px 10px; font-size: 0.82rem; width: auto; background: rgba(7,20,44,0.9);">
            <option value="USD">USD ($)</option>
            <option value="NGN">NGN (₦)</option>
            <option value="USDT">USDT (₮)</option>
            <option value="BTC">BTC (₿)</option>
            <option value="ETH">ETH (Ξ)</option>
          </select>
          <a href="/cart.html" class="icon-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <span class="badge-count" id="header-cart-badge" style="display: none;">0</span>
          </a>
        </div>
      </div>
    </header>

    <main class="container" style="flex: 1; padding-top: 20px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
        <div>
          <h1 style="font-size: 1.5rem; font-weight: 800; color: #FFFFFF;">All Digital Products</h1>
          <p style="font-size: 0.85rem; color: #94A3B8;">Verified premium software, AI accounts, VPN and subscriptions</p>
        </div>
        <div style="width: 100%; max-width: 320px;">
          <input type="search" id="catalog-search" class="form-input" placeholder="Filter products..." />
        </div>
      </div>

      <div class="products-grid" id="catalog-products-grid">
        <div class="skeleton" style="height: 260px;"></div>
        <div class="skeleton" style="height: 260px;"></div>
        <div class="skeleton" style="height: 260px;"></div>
        <div class="skeleton" style="height: 260px;"></div>
      </div>
    </main>

    <nav class="mobile-bottom-nav">
      <a href="/" class="bottom-nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span>Home</span></a>
      <a href="/products.html" class="bottom-nav-item active"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Products</span></a>
      <a href="/cart.html" class="bottom-nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg><span>Cart</span><span class="badge-count" id="bottom-cart-badge" style="display: none; top: 2px; right: 18px;">0</span></a>
      <a href="/my-orders.html" class="bottom-nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg><span>Orders</span></a>
      <a href="/account.html" class="bottom-nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span></a>
    </nav>

    <footer class="site-footer">
      <div class="container footer-credit-locked">
        &copy; 2026 ABDULLAH STORE. &bull; <strong>Developed by MD ABDULLAH</strong>
      </div>
    </footer>

    <script type="module" src="/js/app.js"></script>
    <script type="module">
      import { fetchProducts, renderProductCard } from "/js/products.js";
      import { getCurrency, addToCart, subscribeCart } from "/js/cart.js";

      let products = [];
      const grid = document.getElementById("catalog-products-grid");
      const search = document.getElementById("catalog-search");

      async function load() {
        products = await fetchProducts();
        render();

        subscribeCart(() => render());

        search.addEventListener("input", () => render());

        grid.addEventListener("click", (e) => {
          const btn = e.target.closest(".add-cart-btn");
          if (btn && !btn.disabled) {
            const p = products.find(x => x.id === btn.dataset.productId);
            if (p) addToCart(p, 1);
          }
        });
      }

      function render() {
        const q = search.value.toLowerCase().trim();
        const curr = getCurrency();
        let filtered = products;
        if (q) {
          filtered = filtered.filter(p => p.title.toLowerCase().includes(q) || (p.description||'').toLowerCase().includes(q));
        }
        grid.innerHTML = filtered.map(p => renderProductCard(p, curr)).join("");
      }

      load();
    </script>
  </body>
</html>
