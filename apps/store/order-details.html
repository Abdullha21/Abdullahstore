<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Order Details - ABDULLAH STORE</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="/" class="brand-wrapper">
          <div class="brand-logo-icon">AS</div>
          <span class="brand-title">ABDULLAH STORE</span>
        </a>
      </div>
    </header>

    <main class="container" style="flex: 1; padding-top: 24px; max-width: 760px;">
      <a href="/my-orders.html" style="font-size: 0.85rem; color: var(--neon-cyan);">&larr; Back to My Orders</a>
      <div id="order-details-card" style="margin-top: 16px;">
        <div class="skeleton" style="height: 300px;"></div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-credit-locked">
        &copy; 2026 ABDULLAH STORE. &bull; <strong>Developed by MD ABDULLAH</strong>
      </div>
    </footer>

    <script type="module" src="/js/app.js"></script>
    <script type="module">
      import { auth, db } from "/js/firebase.js";
      import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
      import { formatMoney, escapeHtml } from "/js/utils.js";

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const container = document.getElementById("order-details-card");

      async function load() {
        if (!id) {
          container.innerHTML = "<p>No Order ID provided.</p>";
          return;
        }
        try {
          const snap = await getDoc(doc(db, "orders", id));
          if (!snap.exists()) {
            container.innerHTML = "<p>Order not found.</p>";
            return;
          }
          const ord = snap.data();
          const curr = ord.currency || "USD";
          container.innerHTML = `
            <div class="glass-card" style="padding: 24px;">
              <h2 style="font-size: 1.3rem; font-weight: 800; color: #FFFFFF; margin-bottom: 8px;">Order #${escapeHtml(ord.orderNumber)}</h2>
              <div style="font-size: 0.85rem; color: #94A3B8; margin-bottom: 16px;">Invoice: #${escapeHtml(ord.invoiceNo || ord.orderNumber)}</div>
              
              <div style="display: flex; gap: 8px; margin-bottom: 20px;">
                <span class="badge ${ord.orderStatus === 'COMPLETED' ? 'badge-available' : 'badge-featured'}">Order: ${ord.orderStatus}</span>
                <span class="badge ${ord.paymentStatus === 'PAID' ? 'badge-available' : 'badge-soldout'}">Payment: ${ord.paymentStatus}</span>
              </div>

              <div style="border-top: 1px solid rgba(255,255,255,0.08); padding-top: 14px; margin-bottom: 14px;">
                <h4 style="font-size: 0.9rem; color: #FFFFFF; margin-bottom: 8px;">Purchased Items:</h4>
                ${(ord.items || []).map(i => `
                  <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: #CBD5E1; margin-bottom: 6px;">
                    <span>${i.quantity}x ${escapeHtml(i.title)}</span>
                  </div>
                `).join("")}
              </div>

              <div style="display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 14px; font-size: 1.15rem; font-weight: 800;">
                <span>Total:</span>
                <span style="color: var(--neon-cyan);">${formatMoney(ord.total, curr)}</span>
              </div>

              <div style="margin-top: 20px;">
                <a href="/invoice.html?token=${ord.shareToken}" class="btn btn-primary btn-block">
                  View Full Shareable Invoice
                </a>
              </div>
            </div>
          `;
        } catch (e) {
          container.innerHTML = "<p>Error loading order details.</p>";
        }
      }
      load();
    </script>
  </body>
</html>
