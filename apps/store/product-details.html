<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Product Details - ABDULLAH STORE</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/product.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="/" class="brand-wrapper">
          <div class="brand-logo-icon">AS</div>
          <span class="brand-title">ABDULLAH STORE</span>
        </a>
        <div class="header-actions">
          <select class="currency-selector form-select" style="padding: 6px 10px; font-size: 0.82rem; width: auto; background: rgba(7,20,44,0.9);">
            <option value="USD">USD ($)</option>
            <option value="NGN">NGN (₦)</option>
            <option value="USDT">USDT (₮)</option>
            <option value="BTC">BTC (₿)</option>
            <option value="ETH">ETH (Ξ)</option>
          </select>
          <a href="/cart.html" class="icon-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <span class="badge-count" id="header-cart-badge" style="display: none;">0</span>
          </a>
        </div>
      </div>
    </header>

    <main class="container" style="flex: 1;">
      <div id="product-detail-area" style="padding-top: 24px;">
        <div class="skeleton" style="height: 400px; border-radius: 18px;"></div>
      </div>
    </main>

    <nav class="mobile-bottom-nav">
      <a href="/" class="bottom-nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span>Home</span></a>
      <a href="/products.html" class="bottom-nav-item active"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Products</span></a>
      <a href="/cart.html" class="bottom-nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg><span>Cart</span><span class="badge-count" id="bottom-cart-badge" style="display: none; top: 2px; right: 18px;">0</span></a>
      <a href="/my-orders.html" class="bottom-nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg><span>Orders</span></a>
      <a href="/account.html" class="bottom-nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span></a>
    </nav>

    <footer class="site-footer">
      <div class="container footer-credit-locked">
        &copy; 2026 ABDULLAH STORE. &bull; <strong>Developed by MD ABDULLAH</strong>
      </div>
    </footer>

    <script type="module" src="/js/app.js"></script>
    <script type="module">
      import { getProductById } from "/js/products.js";
      import { addToCart, getCurrency, subscribeCart } from "/js/cart.js";
      import { formatMoney, escapeHtml } from "/js/utils.js";
      import { requireAuthForOrder } from "/js/auth.js";

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const container = document.getElementById("product-detail-area");

      async function render() {
        const prod = await getProductById(id);
        if (!prod) {
          container.innerHTML = `<div style="text-align: center; padding: 48px;"><h2>Product Not Found</h2><a href="/" class="btn btn-primary" style="margin-top: 16px;">Back to Home</a></div>`;
          return;
        }

        const curr = getCurrency();
        const price = prod.prices?.[curr];
        const isAvailable = prod.stockStatus !== "SOLDOUT";
        const img = (prod.images && prod.images[0]) || "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=800&q=80";

        container.innerHTML = `
          <div class="product-details-container">
            <div class="details-gallery">
              <div class="main-gallery-img">
                <img src="${img}" alt="${escapeHtml(prod.title)}" />
              </div>
            </div>

            <div class="details-info">
              <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                <span class="badge ${isAvailable ? 'badge-available' : 'badge-soldout'}">${isAvailable ? 'In Stock' : 'Sold Out'}</span>
                ${prod.isFeatured ? '<span class="badge badge-featured">Featured</span>' : ''}
              </div>
              <h1 style="font-size: 1.8rem; font-weight: 800; color: #FFFFFF; margin-bottom: 12px; line-height: 1.2;">${escapeHtml(prod.title)}</h1>
              
              <div style="font-size: 1.8rem; font-weight: 900; color: var(--neon-cyan); margin-bottom: 16px;">
                ${price !== undefined ? formatMoney(price, curr) : 'Unavailable'}
              </div>

              <div class="glass-card" style="padding: 16px; margin-bottom: 20px;">
                <h4 style="font-size: 0.85rem; color: #94A3B8; text-transform: uppercase; margin-bottom: 6px;">Delivery Information</h4>
                <p style="font-size: 0.9rem; color: #E2E8F0;">${escapeHtml(prod.deliveryInfo || 'Instant credentials delivery to WhatsApp & Email')}</p>
              </div>

              <div style="margin-bottom: 24px; line-height: 1.6; color: #CBD5E1; font-size: 0.95rem;">
                ${escapeHtml(prod.description || '')}
              </div>

              <ul class="details-features-list">
                <li class="details-feature-item">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  <span>100% Genuine Private Account Guarantee</span>
                </li>
                <li class="details-feature-item">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  <span>Replacement Warranty for the Full Term</span>
                </li>
                <li class="details-feature-item">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  <span>24/7 Dedicated Support on Telegram & WhatsApp</span>
                </li>
              </ul>

              <div style="display: flex; gap: 12px; margin-top: 28px;">
                <button id="add-to-cart-btn" class="btn btn-secondary btn-lg" style="flex: 1;" ${!isAvailable ? 'disabled' : ''}>
                  Add to Cart
                </button>
                <button id="buy-now-btn" class="btn btn-primary btn-lg" style="flex: 1;" ${!isAvailable ? 'disabled' : ''}>
                  Buy Now
                </button>
              </div>
            </div>
          </div>
        `;

        document.getElementById("add-to-cart-btn")?.addEventListener("click", () => {
          addToCart(prod, 1);
        });

        document.getElementById("buy-now-btn")?.addEventListener("click", () => {
          addToCart(prod, 1);
          if (requireAuthForOrder("/checkout.html")) {
            window.location.href = "/checkout.html";
          }
        });
      }

      render();
      subscribeCart(() => render());
    </script>
  </body>
</html>
