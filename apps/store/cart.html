<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Shopping Cart - ABDULLAH STORE</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/checkout.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="/" class="brand-wrapper">
          <div class="brand-logo-icon">AS</div>
          <span class="brand-title">ABDULLAH STORE</span>
        </a>
        <div class="header-actions">
          <select class="currency-selector form-select" style="padding: 6px 10px; font-size: 0.82rem; width: auto; background: rgba(7,20,44,0.9);">
            <option value="USD">USD ($)</option>
            <option value="NGN">NGN (₦)</option>
            <option value="USDT">USDT (₮)</option>
            <option value="BTC">BTC (₿)</option>
            <option value="ETH">ETH (Ξ)</option>
          </select>
        </div>
      </div>
    </header>

    <main class="container" style="flex: 1; padding-top: 24px;">
      <h1 style="font-size: 1.6rem; font-weight: 800; color: #FFFFFF; margin-bottom: 8px;">Shopping Cart</h1>
      <p style="font-size: 0.85rem; color: #94A3B8; margin-bottom: 24px;">Review your chosen digital items and proceed to secure checkout</p>

      <div class="cart-layout" id="cart-content-area">
        <!-- Rendered by JS -->
      </div>
    </main>

    <nav class="mobile-bottom-nav">
      <a href="/" class="bottom-nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span>Home</span></a>
      <a href="/products.html" class="bottom-nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Products</span></a>
      <a href="/cart.html" class="bottom-nav-item active"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg><span>Cart</span><span class="badge-count" id="bottom-cart-badge" style="display: none; top: 2px; right: 18px;">0</span></a>
      <a href="/my-orders.html" class="bottom-nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg><span>Orders</span></a>
      <a href="/account.html" class="bottom-nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Account</span></a>
    </nav>

    <footer class="site-footer">
      <div class="container footer-credit-locked">
        &copy; 2026 ABDULLAH STORE. &bull; <strong>Developed by MD ABDULLAH</strong>
      </div>
    </footer>

    <script type="module" src="/js/app.js"></script>
    <script type="module">
      import { getCart, getCurrency, getCartSubtotal, updateQuantity, removeFromCart, proceedToCheckout, subscribeCart } from "/js/cart.js";
      import { formatMoney, escapeHtml } from "/js/utils.js";

      const container = document.getElementById("cart-content-area");

      function render() {
        const cart = getCart();
        const curr = getCurrency();
        const subtotal = getCartSubtotal();

        if (cart.length === 0) {
          container.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 60px 16px; background: rgba(7, 20, 44, 0.4); border-radius: var(--radius-xl); border: 1px dashed rgba(255, 255, 255, 0.1);">
              <div style="font-size: 3rem; margin-bottom: 12px;">🛒</div>
              <h2 style="font-size: 1.25rem; font-weight: 700; color: #FFFFFF; margin-bottom: 8px;">Your cart is empty</h2>
              <p style="color: #94A3B8; font-size: 0.9rem; margin-bottom: 20px;">Explore our catalog of premium verified digital goods.</p>
              <a href="/products.html" class="btn btn-primary">Browse Products</a>
            </div>
          `;
          return;
        }

        container.innerHTML = `
          <div class="cart-items-column">
            ${cart.map(item => `
              <div class="cart-item">
                <img class="cart-item-img" src="${item.image || 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=200&q=80'}" alt="${escapeHtml(item.title)}" />
                <div class="cart-item-details">
                  <h3 style="font-size: 1rem; font-weight: 700; color: #FFFFFF; margin-bottom: 4px;">${escapeHtml(item.title)}</h3>
                  <div style="font-size: 0.95rem; font-weight: 800; color: var(--neon-cyan); margin-bottom: 8px;">
                    ${formatMoney(item.prices?.[curr] || 0, curr)}
                  </div>
                  <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
                    <div class="cart-qty-ctrl">
                      <button class="qty-btn" onclick="window.updateQty('${item.id}', ${item.quantity - 1})">-</button>
                      <span style="font-weight: 700; font-size: 0.9rem;">${item.quantity}</span>
                      <button class="qty-btn" onclick="window.updateQty('${item.id}', ${item.quantity + 1})">+</button>
                    </div>
                    <button style="color: var(--danger); font-size: 0.85rem;" onclick="window.removeItem('${item.id}')">Remove</button>
                  </div>
                </div>
              </div>
            `).join("")}
          </div>

          <div class="summary-card">
            <h3 style="font-size: 1.15rem; font-weight: 800; color: #FFFFFF; margin-bottom: 16px;">Order Summary</h3>
            <div class="summary-row">
              <span>Items Total (${cart.length}):</span>
              <span>${formatMoney(subtotal, curr)}</span>
            </div>
            <div class="summary-row">
              <span>Delivery:</span>
              <span style="color: var(--success); font-weight: 600;">FREE (Instant)</span>
            </div>
            <div class="summary-row total-row">
              <span>Subtotal:</span>
              <span style="color: var(--neon-cyan);">${formatMoney(subtotal, curr)}</span>
            </div>

            <div style="background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.25); border-radius: var(--radius-md); padding: 10px 14px; margin: 16px 0; font-size: 0.8rem; color: #94A3B8;">
              🔒 <strong>Notice:</strong> Customer login is required to complete this order for warranty binding and credentials delivery.
            </div>

            <button id="checkout-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 12px;">
              Proceed to Checkout &rarr;
            </button>
          </div>
        `;

        document.getElementById("checkout-btn")?.addEventListener("click", () => {
          proceedToCheckout();
        });
      }

      window.updateQty = (id, q) => updateQuantity(id, q);
      window.removeItem = (id) => removeFromCart(id);

      render();
      subscribeCart(() => render());
    </script>
  </body>
</html>
