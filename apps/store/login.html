<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Customer Login - ABDULLAH STORE</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body style="justify-content: center; align-items: center; padding: 24px 16px;">
    <div class="glass-card" style="width: 100%; max-width: 440px; padding: 32px 28px;">
      <div style="text-align: center; margin-bottom: 24px;">
        <div class="brand-logo-icon" style="margin: 0 auto 12px; width: 44px; height: 44px; font-size: 1.25rem;">AS</div>
        <h1 style="font-size: 1.5rem; font-weight: 800; color: #FFFFFF;">Welcome to ABDULLAH STORE</h1>
        <p style="font-size: 0.85rem; color: #94A3B8; margin-top: 4px;">Log in to place orders, download credentials, and manage warranty</p>
      </div>

      <button id="google-login-btn" class="btn btn-secondary btn-block" style="margin-bottom: 20px; display: flex; gap: 10px; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.04 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
        Continue with Google
      </button>

      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
        <hr style="flex: 1; border: none; border-top: 1px solid rgba(255,255,255,0.08);" />
        <span style="font-size: 0.75rem; color: #64748B; text-transform: uppercase;">Or with Email</span>
        <hr style="flex: 1; border: none; border-top: 1px solid rgba(255,255,255,0.08);" />
      </div>

      <form id="email-login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-input" required placeholder="you@domain.com" />
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between;">
            <label class="form-label" for="login-password">Password</label>
            <a href="/forgot-password.html" style="font-size: 0.78rem; color: var(--neon-cyan);">Forgot?</a>
          </div>
          <input type="password" id="login-password" class="form-input" required placeholder="••••••••" />
        </div>

        <button type="submit" id="submit-login-btn" class="btn btn-primary btn-block" style="margin-top: 8px;">
          Log In
        </button>
      </form>

      <p style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: #94A3B8;">
        Don't have an account? <a href="/register.html" style="color: var(--neon-cyan); font-weight: 600;">Register here</a>
      </p>

      <div style="text-align: center; margin-top: 16px;">
        <a href="/" style="font-size: 0.8rem; color: #64748B;">&larr; Return to Store</a>
      </div>
    </div>

    <script type="module" src="/js/app.js"></script>
    <script type="module">
      import { loginWithGoogle, loginWithEmail } from "/js/auth.js";

      const params = new URLSearchParams(window.location.search);
      const redirectUrl = params.get("redirect") || "/";

      document.getElementById("google-login-btn").addEventListener("click", async () => {
        try {
          await loginWithGoogle();
          window.location.href = redirectUrl;
        } catch (e) {}
      });

      document.getElementById("email-login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("login-email").value.trim();
        const pass = document.getElementById("login-password").value;
        const btn = document.getElementById("submit-login-btn");
        btn.disabled = true;
        btn.textContent = "Logging in...";
        try {
          await loginWithEmail(email, pass);
          window.location.href = redirectUrl;
        } catch (err) {
          btn.disabled = false;
          btn.textContent = "Log In";
        }
      });
    </script>
  </body>
</html>
