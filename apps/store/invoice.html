<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Official Invoice - ABDULLAH STORE</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/checkout.css" />
    <style>
      @media print {
        body {
          background: #FFFFFF !important;
          color: #000000 !important;
          padding: 0 !important;
        }
        .no-print, header, footer, nav {
          display: none !important;
        }
        .invoice-container {
          box-shadow: none !important;
          border: 1px solid #CCCCCC !important;
          background: #FFFFFF !important;
          color: #000000 !important;
        }
        .invoice-table th {
          background: #EEEEEE !important;
          color: #333333 !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header no-print">
      <div class="container header-inner">
        <a href="/" class="brand-wrapper">
          <div class="brand-logo-icon">AS</div>
          <span class="brand-title">ABDULLAH STORE</span>
        </a>
        <div class="header-actions">
          <button id="print-invoice-btn" class="btn btn-secondary btn-sm">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            Print / Save as PDF
          </button>
          <a href="/" class="btn btn-primary btn-sm">Store &rarr;</a>
        </div>
      </div>
    </header>

    <main class="container" style="flex: 1; padding: 24px 16px;">
      <div id="invoice-render-area">
        <div class="skeleton" style="height: 480px; max-width: 800px; margin: 0 auto; border-radius: 20px;"></div>
      </div>
    </main>

    <footer class="site-footer no-print">
      <div class="container footer-credit-locked">
        &copy; 2026 ABDULLAH STORE. &bull; <strong>Developed by MD ABDULLAH</strong>
      </div>
    </footer>

    <script type="module" src="/js/app.js"></script>
    <script type="module">
      import { initInvoicePage } from "/js/invoice.js";
      initInvoicePage();
    </script>
  </body>
</html>
