<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Customer Register - ABDULLAH STORE</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body style="justify-content: center; align-items: center; padding: 24px 16px;">
    <div class="glass-card" style="width: 100%; max-width: 440px; padding: 32px 28px;">
      <div style="text-align: center; margin-bottom: 24px;">
        <div class="brand-logo-icon" style="margin: 0 auto 12px; width: 44px; height: 44px; font-size: 1.25rem;">AS</div>
        <h1 style="font-size: 1.5rem; font-weight: 800; color: #FFFFFF;">Create Customer Account</h1>
        <p style="font-size: 0.85rem; color: #94A3B8; margin-top: 4px;">Join ABDULLAH STORE to place verified orders & receive digital keys</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-input" required placeholder="John Doe" />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-input" required placeholder="you@domain.com" />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-whatsapp">WhatsApp Phone Number</label>
          <input type="tel" id="reg-whatsapp" class="form-input" required placeholder="+1234567890" />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password (at least 6 characters)</label>
          <input type="password" id="reg-password" class="form-input" required minlength="6" placeholder="••••••••" />
        </div>

        <button type="submit" id="submit-reg-btn" class="btn btn-primary btn-block" style="margin-top: 8px;">
          Create Account
        </button>
      </form>

      <p style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: #94A3B8;">
        Already registered? <a href="/login.html" style="color: var(--neon-cyan); font-weight: 600;">Log in here</a>
      </p>

      <div style="text-align: center; margin-top: 16px;">
        <a href="/" style="font-size: 0.8rem; color: #64748B;">&larr; Return to Store</a>
      </div>
    </div>

    <script type="module" src="/js/app.js"></script>
    <script type="module">
      import { registerWithEmail } from "/js/auth.js";

      document.getElementById("register-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("reg-name").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const whatsapp = document.getElementById("reg-whatsapp").value.trim();
        const pass = document.getElementById("reg-password").value;
        const btn = document.getElementById("submit-reg-btn");

        btn.disabled = true;
        btn.textContent = "Creating Account...";
        try {
          await registerWithEmail(email, pass, name, whatsapp);
          window.location.href = "/";
        } catch (err) {
          btn.disabled = false;
          btn.textContent = "Create Account";
        }
      });
    </script>
  </body>
</html>
