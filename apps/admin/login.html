<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - ABDULLAH STORE</title>
    <link rel="stylesheet" href="/admin/css/variables.css" />
    <link rel="stylesheet" href="/admin/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body style="align-items: center; justify-content: center; padding: 24px;">
    <div class="admin-card" style="width: 100%; max-width: 400px; padding: 32px 28px;">
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--neon-cyan), var(--accent)); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #030817;">AS</div>
        <h1 style="font-size: 1.4rem; font-weight: 800; color: #FFFFFF;">Admin Dashboard Login</h1>
        <p style="font-size: 0.8rem; color: #94A3B8; margin-top: 4px;">Privileged access for store management</p>
      </div>

      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label" for="admin-email">Admin Email</label>
          <input type="email" id="admin-email" class="form-input" required placeholder="admin@domain.com" />
        </div>

        <div class="form-group">
          <label class="form-label" for="admin-pass">Password</label>
          <input type="password" id="admin-pass" class="form-input" required placeholder="••••••••" />
        </div>

        <button type="submit" id="admin-submit-btn" class="btn btn-primary btn-block" style="margin-top: 10px;">
          Log In to Console
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px;">
        <a href="/" style="font-size: 0.8rem; color: #64748B;">&larr; Back to Public Store</a>
      </div>
    </div>

    <script type="module">
      import { adminLogin } from "/admin/js/auth.js";
      import { showAdminToast } from "/admin/js/ui.js";

      document.getElementById("admin-login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("admin-email").value.trim();
        const pass = document.getElementById("admin-pass").value;
        const btn = document.getElementById("admin-submit-btn");

        btn.disabled = true;
        btn.textContent = "Authenticating...";
        try {
          await adminLogin(email, pass);
          window.location.href = "/admin/dashboard.html";
        } catch (err) {
          showAdminToast(err.message || "Invalid credentials", "error");
          btn.disabled = false;
          btn.textContent = "Log In to Console";
        }
      });
    </script>
  </body>
</html>
