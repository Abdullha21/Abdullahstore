<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Send Notifications - Admin</title>
    <link rel="stylesheet" href="/admin/css/variables.css" />
    <link rel="stylesheet" href="/admin/css/base.css" />
    <link rel="stylesheet" href="/admin/css/admin-layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <div class="admin-app">
      <aside class="admin-sidebar"></aside>

      <div class="admin-main">
        <header class="admin-topbar">
          <div style="font-weight: 700; color: #FFFFFF; font-size: 1.1rem;">Broadcast Notifications & Alerts</div>
        </header>

        <main class="admin-content" style="max-width: 700px;">
          <form id="broadcast-notif-form" class="admin-card">
            <h3 style="font-size: 1.1rem; font-weight: 700; color: #FFFFFF; margin-bottom: 16px;">Compose Push / In-App Notification</h3>

            <div class="form-group">
              <label class="form-label">Recipient Audience *</label>
              <select id="notif-target" class="form-select">
                <option value="ALL">All Customers & Visitors</option>
                <option value="CUSTOMER">Registered Customers Only</option>
                <option value="ADMIN">Store Staff & Admins Only</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Notification Title *</label>
              <input type="text" id="notif-title" class="form-input" required placeholder="e.g. Flash 15% Sale on X Premium!" />
            </div>

            <div class="form-group">
              <label class="form-label">Notification Body *</label>
              <textarea id="notif-body" class="form-textarea" rows="3" required placeholder="Use promo code FLASH15 at checkout to claim instant discounts..."></textarea>
            </div>

            <div class="form-group">
              <label class="form-label">Action Target URL (Optional)</label>
              <input type="text" id="notif-link" class="form-input" placeholder="/products.html" />
            </div>

            <button type="submit" id="send-notif-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 14px;">
              Broadcast Notification &rarr;
            </button>
          </form>
        </main>
      </div>
    </div>

    <script type="module">
      import { checkAdminAuth } from "/admin/js/auth.js";
      import { renderAdminLayout } from "/admin/js/ui.js";
      import { sendAdminNotification } from "/admin/js/notifications.js";

      renderAdminLayout("notifications");
      checkAdminAuth();

      document.getElementById("broadcast-notif-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const target = document.getElementById("notif-target").value;
        const title = document.getElementById("notif-title").value.trim();
        const body = document.getElementById("notif-body").value.trim();
        const link = document.getElementById("notif-link").value.trim();

        const btn = document.getElementById("send-notif-btn");
        btn.disabled = true;
        btn.textContent = "Broadcasting...";

        const success = await sendAdminNotification(target, title, body, link);
        if (success) {
          e.target.reset();
        }
        btn.disabled = false;
        btn.textContent = "Broadcast Notification";
      });
    </script>
  </body>
</html>
