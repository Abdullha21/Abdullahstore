<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Methods - Admin</title>
    <link rel="stylesheet" href="/admin/css/variables.css" />
    <link rel="stylesheet" href="/admin/css/base.css" />
    <link rel="stylesheet" href="/admin/css/admin-layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <div class="admin-app">
      <aside class="admin-sidebar"></aside>

      <div class="admin-main">
        <header class="admin-topbar">
          <div style="font-weight: 700; color: #FFFFFF; font-size: 1.1rem;">Store Payment Methods</div>

        <main class="admin-content" style="max-width: 800px;">
          <div id="payment-methods-list">

            <div class="skeleton" style="height: 120px;"></div>
          </div>
        </main>
      </div>

    <script type="module">
      import { checkAdminAuth } from "/admin/js/auth.js";
      import { renderAdminLayout } from "/admin/js/ui.js";
      import { loadAdminPaymentMethods } from "/admin/js/payment-methods.js";

      renderAdminLayout("payment-methods");
      checkAdminAuth(() => {
        loadAdminPaymentMethods();
